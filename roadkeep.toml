# viglet.org's roadkeep configuration. Mirrors Turing's (the docs system here is modeled
# on it, see AGENTS.md), adjusted to what this repo's files already spell.
#
# docs/ROADMAP.md is read by a grammar, not just by people: the em dash in
# `**Title** — why`, in `(deps: —)` and in `## Block A — Title` is the separator the
# parser needs. The site's "no em dashes" copy rule (W37) does not apply to this file;
# swapping them for colons made all 22 lines uncounted.

prefix = "W"

# IMPROVEMENTS.md numbers its rationale by an outline (§II.1), not by task id.
ref_scheme = "outline"

[files]
roadmap = "docs/ROADMAP.md"
changelog = "docs/CHANGELOG.md"

[markers]
open = ["📋", "💭", "⏳", "🛠"]
shipped = "✅"
retired = "🗑"

[ledger]
# Turing's ledger shape: `- **W2** — <prose>`. No marker (the file itself says the work
# shipped) and no bold symptom. Same em-dash rule as the roadmap: it is the separator.
marker = false
symptom = false

[limits.changelog]
# Entries written before the tool are paragraphs; `ship` copies a why already held to 200,
# so only a hand-written `record` could use this room.
why = 2000
line = 2100

[rules.changelog]
# A shipped entry has no section to send a second sentence to.
one_sentence = false
terminator = false

[install]
wired = "0.2.515"
